<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>
    <h1>Color Switcher</h1>

    <button class = "color-btn" data-color = "red">Red</button>
    <button class = "color-btn" data-color ="green">Green</button>
    <button class = "color-btn" data-color ="blue">Blue</button>
    <button id = "random">Random</button>

    <h2 id ="colorCode"></h2>

    <script src="color.js"></script>
</body>
</html>

<!-- class="color-btn"

Class is used to:

style multiple elements using CSS
select multiple elements using JavaScript

All color buttons share the same class:

class="color-btn"

So JavaScript can select all buttons together. -->


<!-- Important Part: data-color
data-color="red"

This is a custom data attribute.

It stores extra information inside the HTML element.

Here:

button stores the color name "red" -->


<!-- Difference Between Class and ID
Class	ID
Used for multiple elements	Used for one element
class=""	id=""
Reusable	Unique -->

<!-- data-*
Store custom data -->
